# The session bus is started before Sway, so it does not know the Wayland
# display. The portals (xdg-desktop-portal, -gtk, -wlr) are started by D-Bus
# when a Flatpak app first asks for one, and need it to open a window or
# capture the screen. --systemd also sets it for user services.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
