# Portal backends for XDG_CURRENT_DESKTOP=sway (set in /etc/sway-desktop/env).
# gtk: file chooser, app chooser, print, settings (the dark colour scheme).
# gnome-keyring: secrets, for sandboxed apps that store passwords.
# wlr: screenshots and screen sharing, through wlroots and PipeWire.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
