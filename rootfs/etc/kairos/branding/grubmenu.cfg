# Hadron Desktop installed-system GRUB menu fragment. kairos-init copies this to
# the COS_STATE partition as /grubmenu (08_grub.yaml "Grub branding"); the main
# /etc/cos/grub.cfg sources it from (${menu_blk}) at the end, so it can both add
# menu entries AND switch the menu to the Tokyo Night gfxterm theme. (menu_blk is
# the device holding /grubmenu — i.e. COS_STATE.)

# Tokyo Night theme on gfxterm. theme.txt needs the gfxmenu and tga modules.
# GRUB loads modules from $prefix/<platform>. On BIOS that is the full module
# tree grub-install wrote, so we load them from there. On EFI it is
# (COS_STATE)/grub2, where kairos-agent puts only five modules, so the
# 09_hadron_grub_theme oem stage puts the image's EFI module tree in
# (COS_STATE)/hadron/grub2 and we point $prefix there only for the insmods. That
# copy has no command.lst: GRUB reads <prefix>/<platform>/command.lst when it
# starts and each time $prefix is set, and its `rmmod: minicmd` line turns the
# no-op rmmod function in /etc/cos/grub.cfg into a real rmmod that prints "no
# such module".
#
# The font theme.txt names, "Unifont Regular 16", is the unicode.pf2 that
# /etc/cos/grub.cfg already loads with `loadfont unicode`. theme.txt's
# desktop-image is a TGA because GRUB's png.mod rejects valid PNGs ("unsupported
# format"). Everything is guarded on the files existing, so a missing one just
# leaves the plain text menu and can never block boot.
if [ -f "${prefix}/${grub_cpu}-${grub_platform}/tga.mod" ]; then
    insmod gfxterm
    insmod gfxmenu
    insmod tga
elif [ -f "(${menu_blk})/hadron/grub2/${grub_cpu}-${grub_platform}/tga.mod" ]; then
    set saved_prefix="${prefix}"
    set prefix="(${menu_blk})/hadron/grub2"
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod tga
    set prefix="${saved_prefix}"
fi
if [ -f (${menu_blk})/themes/hadron/theme.txt ]; then
    set gfxmode=auto
    terminal_output gfxterm
    set theme=(${menu_blk})/themes/hadron/theme.txt
fi

# Quiet the kernel boot further than kairos-init does. Its grub.cfg already
# puts `splash quiet` on the normal entries and deliberately leaves recovery
# verbose. The themed gfxterm menu leaves the GPU in a graphics mode, where the
# udev and kernel-warning churn that `quiet` still lets through renders as
# colourful static over the splash; loglevel=3 and udev.log_level=3 drop that.
# Errors (KERN_ERR and worse) still reach the console. The live ISO menu
# (auroraboot/live-grub.cfg.tmpl) carries the same two. extra_cmdline is
# appended to every entry, so any pre-existing value (e.g. from grubenv) is
# preserved.
#
# The vt.default_* lists set the Linux console's 16 colours to the Hadron
# palette, so the boot messages, the ly login and the console sit on the
# desktop's navy instead of black (ly asks for these colours by index). The
# values are generated from theme/palette.toml by tools/gen-theme.py; the
# live ISO menu (auroraboot/live-grub.cfg.tmpl) carries the same.
set hadron_vt_palette="vt.default_red=0x1a,0xf7,0x9e,0xe0,0x7a,0xbb,0x7d,0xa9,0x73,0xf7,0x9e,0xe0,0x7a,0xbb,0x7d,0xc0 vt.default_grn=0x1b,0x76,0xce,0xaf,0xa2,0x9a,0xcf,0xb1,0x7a,0x76,0xce,0xaf,0xa2,0x9a,0xcf,0xca vt.default_blu=0x26,0x8e,0x6a,0x68,0xf7,0xf7,0xff,0xd6,0xa2,0x8e,0x6a,0x68,0xf7,0xf7,0xff,0xf5"
set extra_cmdline="${extra_cmdline} loglevel=3 udev.log_level=3 ${hadron_vt_palette}"

menuentry "${display_name} remote recovery" --id remoterecovery {
    search --no-floppy --label --set=root COS_RECOVERY
    if [ test -s /cOS/recovery.squashfs ]; then
        set img=/cOS/recovery.squashfs
        set recoverylabel=COS_RECOVERY
    else
        set img=/cOS/recovery.img
    fi
    set label=COS_SYSTEM
    if [ -d (loop0) ]; then
        loopback -d loop0
    fi
    loopback loop0 /$img
    set root=($root)
    source (loop0)/etc/cos/bootargs.cfg
    linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_recovery_cmdline} vga=795 nomodeset kairos.remote_recovery_mode
    initrd (loop0)$initramfs
}
