<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hadron Desktop typefaces: Inter for the interface, JetBrains Mono for
  terminals and code (the Dockerfile hadron-fonts stage installs both).

  It sorts before 60-latin.conf, so these families come first in the generic
  names apps ask for; DejaVu stays next, then the Nerd Font symbols, for
  glyphs the first choice lacks. Noto Color Emoji (the Dockerfile emoji
  stage) is the last fallback and the "emoji" family: Pango and Xft draw
  emoji with it in colour, while a symbol such as a check mark or an arrow
  keeps its text form from the fonts before it. A user's
  ~/.config/fontconfig/fonts.conf (loaded by 50-user.conf) still wins.
-->
<fontconfig>
  <description>Hadron Desktop: Inter and JetBrains Mono as the default families, Noto Color Emoji for emoji</description>

  <!-- Inter 4 names its variable font "Inter Variable". Let "Inter" find it
       too, as long as no static Inter is installed. -->
  <alias binding="same">
    <family>Inter</family>
    <accept><family>Inter Variable</family></accept>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>DejaVu Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter Variable</family>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- The generic family for emoji, which Pango and browsers ask for. -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
