# kairos-init's booted-system splash orders itself before getty@tty1, but this
# desktop runs ly on tty1 and masks getty there. Without this edge ly starts
# while the animation is still drawing and paints the login box over it.
# Lives under /usr/lib, not /etc, so the Kairos /etc overlay cannot shadow it.
[Unit]
Before=ly@tty1.service
