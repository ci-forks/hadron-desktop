# Same gate as ly's: only on a normally booted, installed system. On the live
# ISO and in install-mode the installer owns tty1.
[Unit]
ConditionKernelCommandLine=!install-mode
ConditionPathExists=!/run/cos/live_mode

# /etc is rebuilt at every boot, and the users from the install config are
# created again by the Kairos boot stage (cos-setup-boot.service). The greeter
# reads /etc/passwd once, when it starts, so it must start after that stage:
# otherwise it can list the user under the default name "Created by entities",
# or not at all.
After=cos-setup-boot.service
