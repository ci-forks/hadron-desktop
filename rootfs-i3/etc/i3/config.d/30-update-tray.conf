# The update icon: shows when a new Hadron Desktop is out and installs it.
#
# hadron-update tray is a StatusNotifierItem, and i3bar's tray (tray_output in
# the main config) hosts only XEmbed icons. snixembed shows each
# StatusNotifierItem as an XEmbed icon. --fork returns once it owns the
# StatusNotifierWatcher name, so the tray finds a watcher when it starts (it
# would also register with one that comes later).
exec --no-startup-id snixembed --fork
exec --no-startup-id hadron-update tray
