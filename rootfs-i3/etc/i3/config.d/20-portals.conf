# The portals (xdg-desktop-portal, -gtk) are started by D-Bus when a Flatpak
# app first asks for one, and need the X display to open a file chooser.
# --systemd also sets it for user services, in case the session bus is
# systemd's rather than the one start-desktop opens.
exec --no-startup-id dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
