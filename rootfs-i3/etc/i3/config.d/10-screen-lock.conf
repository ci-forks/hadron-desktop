# Lock the screen on idle and before suspend.
#
# xss-lock runs $lock (set in /etc/i3/config) when the X screen saver
# activates, which XLibre does after 10 minutes without input, when logind
# prepares to sleep, and on `loginctl lock-session`. --transfer-sleep-lock
# holds logind's sleep delay until i3lock has grabbed the screen, so the
# desktop is never visible on resume.
#
# This is a separate file so that an image built on top of this one can turn
# the automatic lock off by shadowing it (the agent image does).
exec --no-startup-id xss-lock --transfer-sleep-lock -- $lock
