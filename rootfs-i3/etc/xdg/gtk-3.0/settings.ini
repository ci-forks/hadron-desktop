# GTK3 on X11 reads its theme from here (no XSETTINGS daemon runs on i3), so
# GTK windows such as the portal's file chooser match the dark desktop.
# Flatpak apps get the dark colour scheme and the fonts through the portal
# instead (90_hadron.gschema.override, the same values).
[Settings]
gtk-application-prefer-dark-theme=true
gtk-font-name=Inter Variable 10.5
