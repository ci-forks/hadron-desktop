# The Isotope palette: one source for the colours of every desktop variant.
#
# Edit a value here, then run `python3 tools/gen-theme.py` to rewrite the
# configs that use it. CI runs `python3 tools/gen-theme.py --check`, which
# fails when a config drifts from this file or a contrast floor is broken.
#
# The colours follow the Kairos design system (github.com/kairos-io/design):
# its violet-ink neutrals, with Isotope lime as the accent. Night is what the
# splash, GRUB, ly, sway and i3 use. Day is for Noctalia's light mode (and
# later COSMIC and Flatpak apps); sway and i3 have no light mode yet.
#
# Roles, not hues: name a colour by what it does, so a config line says
# "inactive label" and not "grey".

[night]
crust     = "#0e0d13"  # darkest: terminal black, text on accent
base      = "#15141c"  # desktop, terminal, bars, popups
surface   = "#1f1e28"  # capsules, cards
overlay   = "#2a2935"  # selection, hover
border    = "#3c3a49"  # inactive borders, separators
muted     = "#5c596a"  # decoration only (2.8:1 on base); never for text you must read
dim       = "#8f8ba3"  # inactive labels, placeholders (4.1:1 on base)
subtext   = "#cbc8d6"  # secondary text
text      = "#f2f1f5"  # primary text
accent    = "#8fd12e"  # focus, selection, brand
glow      = "#c6f36b"  # secondary accent: clock, focus indicator
violet    = "#b49cf2"  # tertiary accent: binding mode, matches
success   = "#3faf6e"
warning   = "#e0af68"
error     = "#f7768e"
orange    = "#ff7442"
on_accent = "#15141c"  # text on accent, error and the other bright fills

[day]
crust     = "#d8d5e0"
base      = "#f2f1f5"
surface   = "#ffffff"
overlay   = "#e6e4ec"
border    = "#c9c5d3"
muted     = "#6e6a80"
dim       = "#5c596a"
subtext   = "#494656"
text      = "#1c1b24"
accent    = "#3b7504"
glow      = "#0b6e6e"
violet    = "#6d3fd0"
success   = "#2a7548"
warning   = "#875700"
error     = "#c4194f"
orange    = "#a33600"
on_accent = "#ffffff"
