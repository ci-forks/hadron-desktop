# Agent appliance: no automatic screen lock (shadows the i3 image's file of
# the same name, which starts xss-lock).
#
# The appliance runs unattended and the agent drives the desktop through XTest
# and screenshots. A lock screen it cannot type a password into would leave it
# blind until someone unlocks the console. XLibre never starts its screen saver
# here (10-agent-no-blank.conf), so xss-lock would not lock on idle anyway, but
# it would still lock before a suspend and on `loginctl lock-session`. Leaving
# it out removes both. Super+Alt+L still locks for an operator at the console.
