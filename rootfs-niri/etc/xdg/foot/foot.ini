# foot terminal for the niri variant: the Hadron palette, the same as sway's
# foot and Noctalia's Hadron palette.
# Colours: generated from theme/palette.toml by tools/gen-theme.py.
font=JetBrains Mono:size=11
dpi-aware=yes
pad=10x10
# foot is built with -Dterminfo=disabled and the image ships only a minimal
# terminfo set (no `foot` entry, no tic to compile one), so foot's default
# TERM=foot leaves less, vim, htop and friends in "terminal is not fully
# functional" mode. xterm-256color is the fallback foot documents for exactly
# this case, and what st uses on the i3 variant.
term=xterm-256color

[cursor]
color=1a1b26 c0caf5

[colors]
alpha=0.96
background=1a1b26
foreground=c0caf5
regular0=16161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5
