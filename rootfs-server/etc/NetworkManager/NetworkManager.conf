# NetworkManager configuration of the server edition.
[main]
plugins=keyfile
dhcp=internal
# NetworkManager is built without polkit. The desktop allows every local user
# (auth-polkit=false); a server can have many users, so only root may change
# the network: `sudo nmcli ...`. Reading it (nmcli device status) needs no root.
auth-polkit=root-only
dns=default
rc-manager=symlink

[logging]
level=INFO
